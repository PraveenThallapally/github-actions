apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: adot-collector
  namespace: monitoring
spec:
  serviceAccount: adot-collector
  mode: deployment
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      prometheus:
        config:
          scrape_configs:
            - job_name: 'kube-state-metrics'
              static_configs:
                - targets: ['kube-state-metrics.kube-state-metrics.svc.cluster.local:8080']
            - job_name: 'node-exporter'
              static_configs:
                - targets: ['prometheus-node-exporter.prometheus-node-exporter.svc.cluster.local:9100']
    exporters:
      prometheusremotewrite:
        endpoint: "https://aps-workspaces.us-west-2.amazonaws.com/workspaces/ws-04ddd7e7-5b69-492e-af4c-141f7d6cd907/api/v1/remote_write"
        auth:
          authenticator: sigv4auth
      awsxray: {}
    extensions:
      sigv4auth:
        region: us-west-2
        service: aps
    service:
      extensions: [sigv4auth]
      pipelines:
        metrics:
          receivers: [otlp, prometheus]
          exporters: [prometheusremotewrite]
        traces:
          receivers: [otlp]
          exporters: [awsxray]
