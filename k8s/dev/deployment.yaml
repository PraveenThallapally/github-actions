apiVersion: apps/v1
kind: Deployment
metadata:
  name: shack-dev
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shack
  template:
    metadata:
      labels:
        app: shack
    spec:
      containers:
        - name: shack-c
          image: praveen1351/shack:v5
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: db-credentials
